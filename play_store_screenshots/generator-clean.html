<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ভোলাবাসী Store Screens</title>
  <style>
    @font-face { font-family: Hind; src: url("../assets/fonts/HindSiliguri-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Hind; src: url("../assets/fonts/HindSiliguri-SemiBold.ttf"); font-weight: 600; }
    @font-face { font-family: Hind; src: url("../assets/fonts/HindSiliguri-Bold.ttf"); font-weight: 800; }
    * { box-sizing: border-box; }
    body { width:1080px; height:1920px; margin:0; overflow:hidden; font-family:Hind, sans-serif; color:#11332d; }
    .poster { position:relative; width:1080px; height:1920px; overflow:hidden; background:linear-gradient(160deg,#f7fffc 0%,#def8ee 52%,#09866c 100%); }
    .poster:before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 20% 8%,rgba(39,183,137,.25),transparent 30%),radial-gradient(circle at 94% 20%,rgba(159,211,86,.26),transparent 32%); }
    .arc { position:absolute; left:-140px; right:-140px; bottom:-155px; height:720px; background:linear-gradient(135deg,#08725e,#0aad80); border-radius:48% 52% 0 0/24% 30% 0 0; box-shadow:0 -36px 90px rgba(7,70,57,.18); }
    .brand { position:absolute; top:66px; left:70px; width:275px; z-index:2; filter:drop-shadow(0 14px 22px rgba(6,84,67,.14)); }
    .copy { position:absolute; z-index:3; left:70px; top:206px; right:70px; }
    .pill { display:inline-flex; padding:10px 18px; border-radius:999px; background:rgba(255,255,255,.82); color:#08725e; font-size:30px; font-weight:800; box-shadow:0 14px 30px rgba(7,70,57,.08); }
    h1 { margin:28px 0 0; max-width:820px; font-size:76px; line-height:1.04; letter-spacing:0; font-weight:800; color:#123b33; }
    .sub { margin:22px 0 0; max-width:735px; font-size:34px; line-height:1.35; font-weight:600; color:#476861; }
    .dots { position:absolute; right:58px; top:520px; width:180px; height:180px; opacity:.15; background-image:radial-gradient(#075d4f 4px,transparent 4px); background-size:24px 24px; }
    .phone-wrap { position:absolute; z-index:4; right:78px; bottom:130px; width:555px; height:1122px; perspective:1700px; }
    .phone { position:absolute; inset:0; padding:22px; border-radius:72px; background:linear-gradient(145deg,#1a2824 0%,#f9fffd 7%,#0c1715 13%,#43544f 100%); box-shadow:0 70px 105px rgba(6,51,42,.34),0 20px 30px rgba(0,0,0,.18); transform:rotateY(-17deg) rotateZ(2deg) rotateX(2deg); }
    .screen { position:relative; height:100%; border-radius:52px; background:#fbfefd; overflow:hidden; }
    .notch { position:absolute; top:20px; left:50%; width:162px; height:46px; margin-left:-81px; border-radius:0 0 24px 24px; background:#101817; z-index:9; }
    .small { left:68px; right:auto; bottom:520px; width:330px; height:668px; opacity:.95; }
    .small .phone { padding:15px; border-radius:50px; transform:rotateY(20deg) rotateZ(-8deg); box-shadow:0 44px 80px rgba(7,52,43,.24); }
    .small .screen { border-radius:36px; }
    .small .notch { top:12px; width:96px; height:28px; margin-left:-48px; border-radius:0 0 14px 14px; }
    .feature { position:absolute; z-index:5; left:70px; bottom:245px; width:420px; padding:30px; border-radius:34px; background:rgba(255,255,255,.88); box-shadow:0 34px 70px rgba(4,59,49,.18); backdrop-filter:blur(18px); }
    .feature b { display:block; font-size:38px; line-height:1.18; color:#08725e; }
    .feature span { display:block; margin-top:12px; font-size:26px; line-height:1.38; color:#536d67; font-weight:600; }
    .shot2 .phone { transform:rotateY(17deg) rotateZ(-3deg); }
    .shot2 .phone-wrap:not(.small) { left:82px; right:auto; }
    .shot2 .copy { left:500px; right:70px; }
    .shot2 .feature { left:540px; }
    .shot2 .small { left:auto; right:82px; bottom:540px; }
    .shot3 .phone-wrap:not(.small) { width:590px; height:1192px; right:48px; bottom:86px; }
    .shot4 .poster { background:linear-gradient(160deg,#fff9f9 0%,#eaf9f2 48%,#b91422 100%); }
    .shot4 .arc { background:linear-gradient(135deg,#b91422,#08725e); }
    .shot4 .pill,.shot4 .feature b { color:#b91422; }
    .shot5 .phone-wrap:not(.small) { width:420px; height:850px; right:82px; bottom:260px; }
    .shot5 .small { width:410px; height:830px; left:70px; bottom:280px; }
    .shot5 .feature { width:860px; bottom:130px; }
    .app { height:100%; background:#fbfefd; padding:68px 34px 26px; color:#1c2d29; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
    .mini-logo { width:150px; }
    .circle { width:52px; height:52px; border-radius:50%; background:#eef9f5; display:grid; place-items:center; font-size:28px; color:#08725e; }
    .hero-card { padding:28px; border-radius:28px; background:#effbf6; border:1px solid #d7eee6; display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .hero-card h3 { margin:0 0 8px; font-size:26px; }
    .hero-card p { margin:0; font-size:22px; color:#5f756f; }
    .logo-box { width:150px; height:110px; border-radius:22px; background:white; display:grid; place-items:center; box-shadow:0 18px 34px rgba(7,92,75,.1); }
    .logo-box img { width:118px; }
    .section { padding:24px 22px; border-radius:28px; background:white; border:1px solid #e5efec; margin-bottom:22px; box-shadow:0 16px 40px rgba(8,62,51,.05); }
    .section-title { display:flex; justify-content:space-between; align-items:center; font-size:25px; font-weight:800; margin-bottom:22px; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px 16px; }
    .svc { text-align:center; font-size:18px; font-weight:700; }
    .ico { width:70px; height:70px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center; background:#eaf8f3; color:#08725e; font-size:34px; }
    .quick { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .quick > div,.row { border-radius:18px; background:#fff; border:1px solid #e4efeb; padding:18px; font-weight:800; font-size:21px; }
    .nav { position:absolute; left:34px; right:34px; bottom:24px; height:88px; border-radius:26px; background:rgba(255,255,255,.92); box-shadow:0 12px 40px rgba(8,62,51,.12); display:flex; align-items:center; justify-content:space-around; color:#08725e; font-size:24px; }
    .list .row { display:flex; align-items:center; gap:18px; margin-bottom:18px; padding:22px; font-size:23px; }
    .list small { display:block; margin-top:5px; color:#697b77; font-size:18px; font-weight:500; }
    .search { height:62px; border-radius:20px; background:#eef8f5; padding:16px 20px; font-size:22px; color:#607771; margin-bottom:18px; }
    .food-card { display:flex; gap:16px; padding:14px; border-radius:22px; border:1px solid #e3efeb; margin-bottom:14px; background:white; }
    .food-img { width:96px; height:96px; border-radius:20px; background:linear-gradient(135deg,#ffdfb9,#ff855e); display:grid; place-items:center; font-size:42px; }
    .food-card b { font-size:22px; }
    .food-card p { margin:6px 0; color:#60746f; font-size:17px; }
    .price { color:#08725e; font-size:22px; font-weight:800; }
    .map { height:250px; border-radius:24px; background:linear-gradient(135deg,#d9f3e8,#bde5d2); margin:14px 0; position:relative; overflow:hidden; }
    .map:before,.map:after { content:""; position:absolute; background:#effaf6; height:18px; width:420px; transform:rotate(-18deg); left:-40px; top:100px; border-radius:30px; }
    .map:after { transform:rotate(28deg); top:152px; left:100px; }
    .pin { position:absolute; width:32px; height:32px; border-radius:50%; background:#e21b2d; border:6px solid white; box-shadow:0 8px 18px rgba(0,0,0,.18); }
    .p1 { left:120px; top:90px; } .p2 { right:130px; bottom:72px; background:#08725e; }
    .dialog { margin-top:40px; padding:28px; border-radius:28px; background:white; box-shadow:0 20px 50px rgba(0,0,0,.16); }
    .danger { color:#b91422; }
  </style>
</head>
<body><div id="root"></div>
<script>
const data=[
["shot1","ভোলার সব সেবা","এক অ্যাপে সহজ জীবন","ফুড ডেলিভারি, মার্কেটপ্লেস, কর্মী খোঁজ, ব্যবসা ডিরেক্টরি সব একসাথে।","সব সেবা এক জায়গায়","দ্রুত অ্যাকশন থেকে প্রয়োজনীয় সেবা খুলুন কয়েক সেকেন্ডে।","home","more"],
["shot2","ফুড ডেলিভারি","পছন্দের খাবার খুঁজুন দ্রুত","রিয়েলটাইম সার্চ, কার্ট, পেমেন্ট এবং ডেলিভারি ট্র্যাকিং একসাথে।","স্মার্ট ফুড অর্ডার","আইটেম আগে দেখুন, চাইলে রেস্টুরেন্টে যান, তারপর অর্ডার করুন।","food","home"],
["shot3","নিরাপত্তা","পাসওয়ার্ড, ডিভাইস ও অ্যাকাউন্ট সুরক্ষা","OTP verification, login devices এবং account deletion flow সহ নিরাপদ ব্যবস্থা।","নিরাপত্তা আগে","সেনসিটিভ অ্যাকশনে পরিষ্কার confirmation ও safe flow।","security","more"],
["shot4","বিশ্বাসযোগ্য নিয়ন্ত্রণ","ডিলিট রিকোয়েস্টও পরিষ্কারভাবে","User consent, সাপোর্ট page এবং policy-friendly account deletion experience।","প্লে স্টোর প্রস্তুত","Privacy, terms এবং delete account সাপোর্ট flow প্রস্তুত।","delete","security"],
["shot5","Sohoj IT","ভোলাবাসী","ভোলার মানুষের জন্য আধুনিক, দ্রুত এবং নিরাপদ সুপার অ্যাপ অভিজ্ঞতা।","স্থানীয় সেবা, প্রফেশনাল অভিজ্ঞতা","বাংলা UI, রিয়েলটাইম আপডেট, সাপোর্ট, পেমেন্ট এবং ডেলিভারি প্রস্তুত ভিত্তি।","track","food"]
];
function screen(kind){
 if(kind==="home") return `<div class=app><div class=top><img class=mini-logo src="../assets/images/logo_bholavashi_landscape_size.png"><div class=circle>🔔</div></div><div class=hero-card><div><h3>ভোলাবাসী</h3><p>ভোলার সব সেবা এক অ্যাপে</p></div><div class=logo-box><img src="../assets/images/logo_bholavashi_squre.png"></div></div><div class=section><div class=section-title><span>সব সেবা</span><span>▦ সব</span></div><div class=grid>${["🛵<br>ফুড","🏪<br>মার্কেট","👷<br>কর্মী","🏢<br>ব্যবসা","💼<br>চাকরি","🏠<br>প্রোপার্টি","🩸<br>রক্ত","➕<br>হাসপাতাল"].map(x=>`<div class=svc><div class=ico>${x.split("<br>")[0]}</div>${x.split("<br>")[1]}</div>`).join("")}</div></div><div class=section><div class=section-title>দ্রুত অ্যাকশন</div><div class=quick><div>➕ আইটেম পোস্ট</div><div>🏠 প্রোপার্টি যোগ</div></div></div><div class=nav>⌂ ⚒ ▣ 👥 ☰</div></div>`;
 if(kind==="food") return `<div class=app><div class=top><div><h3 style="font-size:32px;margin:0">ফুড ডেলিভারি</h3><p style="margin:2px 0 0;color:#667">আজ কী খাবেন?</p></div><div class=circle>🛒</div></div><div class=search>🔍 খাবার বা রেস্টুরেন্ট খুঁজুন</div><div class=food-card><div class=food-img>🍚</div><div><b>ভাত ও ভর্তা সেট</b><p>থাই রেস্টুরেন্ট</p><span class=price>৳120</span></div></div><div class=food-card><div class=food-img>🍔</div><div><b>চিকেন বার্গার</b><p>ফাস্ট ফুড কর্নার</p><span class=price>৳180</span></div></div><div class=food-card><div class=food-img>🥘</div><div><b>কাচ্চি বিরিয়ানি</b><p>ভোলা কিচেন</p><span class=price>৳260</span></div></div><div class=section><div class=section-title>চেকআউট</div><div class=row>📍 ম্যাপ থেকে লোকেশন</div><div class=row>💳 bKash / Nagad / COD</div></div><div class=nav>⌂ 🛵 🛒 📍 ☰</div></div>`;
 if(kind==="security") return `<div class=app><div class=top><div><h3 style="font-size:32px;margin:0">অ্যাকাউন্ট ও সিকিউরিটি</h3><p style="margin:2px 0 0;color:#667">প্রাইভেসি ও নিরাপত্তা</p></div></div><div class="section list"><div class=row><div class=ico>🔒</div><div>পাসওয়ার্ড পরিবর্তন<small>OTP দিয়ে অ্যাকাউন্ট সুরক্ষিত রাখুন</small></div></div><div class=row><div class=ico>💻</div><div>লগইন ডিভাইস<small>সক্রিয় ডিভাইস তালিকা</small></div></div><div class=row><div class=ico>🗑</div><div><span class=danger>ডিলিট অ্যাকাউন্ট</span><small>সাপোর্টের মাধ্যমে অনুরোধ করুন</small></div></div></div><div class=nav>⌂ ⚒ ▣ 👥 ☰</div></div>`;
 if(kind==="delete") return `<div class=app><div class=top><div><h3 style="font-size:32px;margin:0">অ্যাকাউন্ট ও সিকিউরিটি</h3><p style="margin:2px 0 0;color:#667">প্রাইভেসি ও নিরাপত্তা</p></div></div><div class="section list"><div class=row><div class=ico>🔒</div><div>পাসওয়ার্ড পরিবর্তন<small>আপনার অ্যাকাউন্ট সুরক্ষিত রাখুন</small></div></div><div class=row><div class=ico>💻</div><div>লগইন ডিভাইস<small>সক্রিয় ডিভাইস তালিকা</small></div></div></div><div class=dialog><h3 style="font-size:30px;margin:0 0 14px">অ্যাকাউন্ট ডিলিট রিকোয়েস্ট</h3><p style="font-size:23px;line-height:1.5;color:#566">You will be redirected to the official ভোলাবাসী account deletion request page.</p><div style="height:62px;border-radius:18px;background:#c91822;color:white;display:grid;place-items:center;font-size:24px;font-weight:800;margin-top:24px">চালিয়ে যান</div></div></div>`;
 return `<div class=app><div class=top><div><h3 style="font-size:32px;margin:0">লাইভ ডেলিভারি</h3><p style="margin:2px 0 0;color:#667">রাইডার ট্র্যাকিং</p></div><div class=circle>📍</div></div><div class=map><div class="pin p1"></div><div class="pin p2"></div></div><div class=section><div class=section-title>অর্ডার প্রগ্রেস</div><div class=row>✅ রেস্টুরেন্ট গ্রহণ করেছে</div><div class=row>🛵 রাইডার খাবার নিয়েছে</div><div class=row>📍 শেষ আপডেট: এইমাত্র</div></div><div class=section><div class=section-title>পেমেন্ট</div><div class=row>💳 ম্যানুয়াল bKash যাচাই হয়েছে</div><div class=row>🧾 ট্রানজেকশন আইডি জমা হয়েছে</div></div><div class=nav>⌂ 🛵 🛒 📍 ☰</div></div>`;
}
const i=Math.max(0,Math.min(4,Number(new URLSearchParams(location.search).get("shot")||1)-1)), s=data[i];
document.body.className=s[0];
root.innerHTML=`<main class=poster><img class=brand src="../assets/images/logo_bholavashi_landscape_size.png"><div class=dots></div><section class=copy><div class=pill>${s[1]}</div><h1>${s[2]}</h1><p class=sub>${s[3]}</p></section><div class="phone-wrap small"><div class=phone><div class=notch></div><div class=screen>${screen(s[7])}</div></div></div><div class=phone-wrap><div class=phone><div class=notch></div><div class=screen>${screen(s[6])}</div></div></div><aside class=feature><b>${s[4]}</b><span>${s[5]}</span></aside><div class=arc></div></main>`;
</script></body>
</html>
