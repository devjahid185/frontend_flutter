name: frontend_flutter
description: "ভোলাবাসী Flutter client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  firebase_core: ^3.1.1
  firebase_messaging: ^15.1.0
  facebook_app_events: ^0.30.5
  flutter_local_notifications: ^17.2.2
  in_app_update: ^5.0.0
  flutter_map: ^8.3.1
  google_maps_flutter: ^2.10.0
  latlong2: ^0.10.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/favicon_bholavashi_copy.png
  min_sdk_android: 21
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: assets/images/favicon_bholavashi_copy.png

flutter_native_splash:
  color: "#000000"
  image: assets/images/favicon_bholavashi__copy.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/favicon_bholavashi__copy.png
